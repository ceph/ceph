id: "75414"
tracker: https://tracker.ceph.com/issues/75414
title: "upgrade: pool full warning variation"
kind: test
fixes:
  - pr: https://github.com/ceph/ceph/pull/68325
    branch: main
    fixed_in: v21.3.0-797-g387871c86d
tree: cluster-log/message
facts:
  level: '^WRN$'
  message: '^Health detail: HEALTH_WARN \d+ pool\(s\) full$'
match:
  reason: 'pool\(s\) full" in cluster log'
confirm:
  - file: teuthology.log
    pattern: 'Health detail: HEALTH_WARN \d+ pool\(s\) full'
notes: |
  The upgrade suites' log-ignorelist (qa/suites/upgrade/*/overrides/ignorelist_health.yaml and the
  0-start.yaml overrides) has only the parenthesised form \(POOL_FULL\). The upgrade job's workloads
  (rbd test_librbd) set small pool quotas, so pools reach their quota and the mons raise POOL_FULL.
  The health check lines carry "(POOL_FULL)" and are ignored, but the mon's periodic
  "Health detail: HEALTH_WARN N pool(s) full" line does not, so the final cluster-log scan fails
  the job with a [WRN] it does not ignore. The cause is the incomplete ignorelist, a test problem;
  the cluster behaved as intended. PR 68325 adds the POOL_FULL variations to the ignorelists.
examples:
