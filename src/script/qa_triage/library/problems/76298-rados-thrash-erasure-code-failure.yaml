id: "76298"
tracker: https://tracker.ceph.com/issues/76298
title: "rados/thrash-erasure-code failure - not all PGs are active or peered"
kind: test
match:
  description: 'thrashers/minsize_recovery'
  reason: "OSDThrasher threw exception 'check for active or peered'|status 124: .*ceph --cluster ceph status --format=json"
confirm:
  - file: teuthology.log
    pattern: "MaxWhileTries: 'check for active or peered' reached maximum tries"
notes: |
  The minsize_recovery thrasher runs OSDThrasher.test_pool_min_size (qa/tasks/ceph_manager.py):
  for each EC pool it picks a random PG, kills min(live - max(min_size, k), m) OSDs of its
  acting set and marks them out, then checks with safe_while(sleep=25, tries=5,
  action='check for active or peered') that every PG is active or peered. Here a PG does not
  peer: in 563110 (k=2, m=1) killing only osd.4 left PG 1.3 stale+remapped+peering and then
  'down' (version 0'0) for all 5 checks, so MaxWhileTries "'check for active or peered' reached
  maximum tries (5) after waiting for 125 seconds" is raised in test_pool_min_size, the daemon
  watchdog logs 'OSDThrasher failed', barks and kills all daemons, and the job fails with the
  BarkError (or a task waiting on the cluster times out, or the job hangs). No daemon crashed.
  'down' means peering needs an OSD of a past interval that is now dead: losing m shards
  should leave k, so the shards left were likely not all complete. A possible cause is the
  previous round's revived OSD not being fully recovered: wait_for_recovery's is_recovered only
  rejects recover/backfilling/stale states, so degraded, undersized or backfill_wait PGs pass,
  and the jobs often use more-async-(partial-)recovery overrides. The tracker has no root
  cause yet. The record has no tree, because the same cause ends at different symptoms and so
  at different tree paths: 563110 is explained at timeout/unexplained/thrasher-min-size-pgs-not-active,
  while in 237418 the job failed on `ceph status` timing out (status 124) 2 minutes after the
  bark, so the tree stopped at command/timed-out. The match on the minsize_recovery description
  and on a reason that is the BarkError naming the 'check for active or peered' exception, or
  a status 124 on `ceph status`, picks the candidates, and the strict confirm check on the
  thrasher's MaxWhileTries line decides. The BarkError, the ceph CLI timeouts (status 124: ceph
  status, osd dump, pg dump, osd unset noscrub, which the killed daemons can no longer answer)
  and 'Manager failed' lines after the bark are symptoms. Jobs the tracker lists that timed
  out on another command, such as `ceph pg dump`, are the same cause but are not matched here
  until someone checks them and adds them as examples. The same failure that ends in a job hang
  is explained at hung/command/thrasher-min-size-pgs-not-active (nodes/hung-command.py).
  wait_for_recovery failures (74794, 75216, 70279) end in 'wait_for_recovery: failed before
  timeout expired' instead.
examples:
  - jenkins-build-2026-09-17_06:05:09-rados-main-distro-default-trial/563110
  - skanta-2026-05-26_00:44:20-rados-wip-bharath17-testing-2026-05-25-1331-distro-default-trial/237418
