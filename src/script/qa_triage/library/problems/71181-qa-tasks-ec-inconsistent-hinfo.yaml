notes: |
  In qa/tasks/ec_inconsistent_hinfo.py, after marking a non-primary OSD out and waiting
  for backfilling and clean (via wait_for_clean), the test immediately asserts that 'clean'
  is in pg['state'].split('+').
  However, after remapping and backfill completion, the PG enters a new peering interval
  and momentarily shifts into 'peering' state before transitioning back to active+clean.
  The assertion fails with AssertionError when pg['state'] is 'peering'.
