id: "72945"
tracker: https://tracker.ceph.com/issues/72945
title: "Data digests are inconsistent during scrubbing"
kind: product
fixes:
  - pr: https://github.com/ceph/ceph/pull/65623
    branch: main
    fixed_in: v20.3.0-5156-gdfa42f1600
tree: cluster-log/message
facts:
  level: '^ERR$'
  message: 'data digests are inconsistent$'
  reporter: '^osd\.'
confirm:
  - file: teuthology.log
    pattern: 'cluster \[ERR\] \S+ \S+data digests are inconsistent'
notes: |
  During deep scrub of an erasure-coded pool with optimized EC (ec_optimizations_on), the
  ScrubBackend (src/osd/scrubber/scrub_backend.cc) logs '<pg> <object>data digests are
  inconsistent' as an [ERR] to the cluster log although the data is fine. The teardown
  cluster-log scan treats any un-ignored [ERR] as a failure. The cause is in the scrub code:
  crc buffers were compared beyond their end, logical_to_ondisk_size was called twice when
  creating the crcs of zero buffers so they were mis-sized, and smaller shards were not padded
  although shards must be the same size for the parity comparison. PR 65623 fixes all three
  (merged as v20.3.0-5156-gdfa42f1600). Builds older than that, such as 20.3.0-4929-g58ab6e40,
  still have the bug. The error names the PG and the object, so the failure text differs
  between jobs (benchmark_data_* objects of ec-radosbench, or objects of other workloads such
  as the rados api tests); the PG is not damaged and the scrub only fails to compare correctly.
