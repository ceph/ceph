  - file: teuthology.log
    pattern: 'self\._wait_for_killpoint_death\(\)'
notes: |
  In tasks.mgr.test_devicehealth.TestDeviceHealth.test_sql_autocommit1, the test
  sets mgr/devicehealth/sqlite3_killpoint to 1 and calls _wait_for_killpoint_death()
  to verify that the active mgr terminates when hitting the killpoint. In
  mgr_module.py, the sqlite3 killpoint called os._exit(120), but cephadm/module.py
  monkeypatched os._exit with os_exit_noop to prevent cherrypy exit calls from
  terminating the process. Consequently, os._exit was a no-op, the mgr daemon
  remained alive, and the test's wait_until_true timed out after 30 seconds.
  Fixed in PR #67632 by calling _ceph_exit instead of os._exit for killpoints.
