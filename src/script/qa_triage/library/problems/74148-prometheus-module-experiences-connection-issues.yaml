id: "74148"
tracker: https://tracker.ceph.com/issues/74148
title: "Prometheus module experiences connection issues related to cherrypy"
kind: product
fixes:
  - pr: https://github.com/ceph/ceph/pull/66571
    branch: main
    fixed_in: v20.3.0-5831-g7d9f8f3b5f
tree: command/unexplained/prometheus-module-inactive
facts: {}
notes: |
  The mgr/prometheus module deadlocks in HealthHistory.check() when trying to
  acquire a Lock it already holds. Using RLock resolves this issue. The deadlock
  makes the prometheus module unreachable and inactive, triggering the alert
  "CephMgrPrometheusModuleInactive". The monitoring test then fails to assert
  "CephMonDown" because no such alert fires (status 4 from jq -e).
