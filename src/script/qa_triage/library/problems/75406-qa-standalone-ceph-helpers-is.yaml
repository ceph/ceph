id: "75406"
tracker: https://tracker.ceph.com/issues/75406
title: "qa/standalone/ceph-helpers: is_pg_clean hang after osd teardown"
kind: test
fixes:
  - pr: https://github.com/ceph/ceph/pull/67715
    branch: main
    fixed_in: v21.0.0-1245-g2643ea61a5
tree: workunit/unexplained/ceph-pg-query-hung/osd-killed-pg-query-no-timeout
facts:
  command: '^ceph pg query$'
confirm:
  - file: teuthology.log
    pattern: 'test_pg_scrub:\s+WAIT_FOR_CLEAN_TIMEOUT=10'
  - file: teuthology.log
    pattern: 'is_pg_clean:\s+ceph pg \S+ query'
also:
  - "74004"
  - "75217"
notes: |
  In qa/standalone/ceph-helpers.sh, after PR #66457 fixed #74004 by adding
  WAIT_FOR_CLEAN_TIMEOUT=10 TIMEOUT=2 to the pg_scrub call in test_pg_scrub,
  the same test still hangs: is_pg_clean's `ceph pg $pgid query`
  (ceph-helpers.sh:1574) has no timeout, so after the OSD is killed the query
  to the dead OSD never returns. The workunit's outer `timeout 3h` eventually
  kills it with status 124. PR #67715 fixes this by adding a timeout to ceph pg
  query in is_pg_clean.
  Tracker #75217 (ceph-objectstore-tool: No object id 'NOTEXISTS' found) lists
  these jobs too, but its NOTEXISTS line is test_objectstore_tool's expected
  failure (`! objectstore_tool ... NOTEXISTS get-bytes`, ceph-helpers.sh:1310),
  not the cause; the hang is the same as here.
