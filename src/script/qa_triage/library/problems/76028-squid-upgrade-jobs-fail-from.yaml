id: "76028"
tracker: https://tracker.ceph.com/issues/76028
title: "squid: upgrade jobs fail from missing untagged versions of reef and quincy"
kind: test
fixes:
  - pr: https://github.com/ceph/ceph/pull/68451
    branch: squid
    fixed_in: v19.2.3-825-g51ce132a2e
tree: cluster-log/other/cephadm-pull-manifest-unknown
match:
  reason: 'No such file or directory'
confirm:
  - file: teuthology.log
    pattern: 'reading manifest \S+ in quay\.ceph\.io/ceph-ci/ceph: (manifest unknown|unknown: Tag \S+ was deleted)'
notes: |
  In upgrade suites (e.g. quincy-x, reef-x), cephadm attempts to pull untagged container
  images from quay.ceph.io/ceph-ci/ceph:<release> (e.g. quincy or reef). Because HEAD
  containers for those branches were removed following the lab relocation, podman pull fails
  with either "reading manifest <release> in quay.ceph.io/ceph-ci/ceph: manifest unknown"
  or "unknown: Tag <release> was deleted or has expired" depending on the quay error variant.
  During cephadm task teardown, the cluster log check attempts to grep /var/log/ceph/<fsid>/ceph.log,
  which does not exist because the cluster was never deployed. cephadm misinterprets
  the "grep: ... No such file or directory" error on stderr as a cluster log error and
  records '"grep: /var/log/ceph/<fsid>/ceph.log: No such file or directory" in cluster log'
  as the failure reason.
  PR #68451 fixes the upgrade suite yaml to use tagged versions (e.g. v17.2.8, v18.2.8).
  The rados/encoder suite on tentacle branches fails the same way (floating quincy tag in
  qa/suites/rados/encoder/1-tasks.yaml) and people place those jobs in tracker 73921 (fixed by
  PR #66337), so 73921 is listed in `also`.
examples:
  - jayaprakash-2026-04-29_15:21:37-rados-wip-jaya-bs-testing-tentacle-29-04-2026-distro-default-trial/185866
  - skanta-2026-04-06_14:05:55-rados-wip-bharath14-testing-2026-04-06-1412-squid-distro-default-trial/133531
  - skanta-2026-04-06_10:52:21-rados-wip-bharath15-testing-2026-04-06-1414-tentacle-distro-default-trial/133287
also:
  - "74175"
  - "75886"
  - "73921"
