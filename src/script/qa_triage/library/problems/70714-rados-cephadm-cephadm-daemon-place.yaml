id: "70714"
tracker: https://tracker.ceph.com/issues/70714
title: "rados/cephadm: CEPHADM_DAEMON_PLACE_FAIL - Failed to extract uid/gid for path /var/lib/grafana"
kind: infra
tree: timeout/unexplained/registry-pull-failed
facts:
  error: '^registry-pull-failed$'
confirm:
  - file: teuthology.log
    pattern: 'Failed while placing \S+ on \S+: .*(?:unexpected HTTP status: 50\d|TLS handshake timeout)'
  - file: teuthology.log
    pattern: 'Health check failed: Failed to place \d+ daemon\(s\) \(CEPHADM_DAEMON_PLACE_FAIL\)'
notes: |
  cephadm deploys a monitoring or gateway daemon (grafana, prometheus, alertmanager,
  node-exporter, mgmt-gateway) by first running its container image with
  'podman run --entrypoint stat ... -c %u %g <path>' to find the uid/gid of a path in
  it. When quay.io is unavailable the pull fails: 'pinging container registry quay.io:
  received unexpected HTTP status: 502 Bad Gateway' (or 'TLS handshake timeout', or a
  502 while fetching a blob). cephadm then fails with 'Failed to extract uid/gid for
  path ...', the mgr logs '[ERR] Failed while placing <daemon> on <host>' and the mon
  raises CEPHADM_DAEMON_PLACE_FAIL. The daemon is never deployed, so whatever the job
  waits for (here cephadm.wait_for_service for mgmt-gateway in test_mgmt_gateway, 300 s)
  times out. The timeout is the symptom; the cause is the registry outage (transient,
  not the code under test). The tree sets error=registry-pull-failed at
  timeout/unexplained when teuthology.log has the 'Failed while placing' line with the
  registry error.
  Tracker 70714 is New; people place later jobs of this kind in it (comments list
  squid, tentacle and main runs).
examples:
  - skanta-2026-04-21_10:56:08-rados-wip-bharath2-testing-2026-04-21-1241-distro-default-trial/165894
