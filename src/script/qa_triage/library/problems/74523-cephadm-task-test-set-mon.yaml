id: "74523"
tracker: https://tracker.ceph.com/issues/74523
title: "cephadm: task/test_set_mon_crush_locations fails because mon.a's crush location is not in datacenter a"
kind: test
fixes:
  - pr: https://github.com/ceph/ceph/pull/67436
    branch: main
    fixed_in: v20.3.0-6111-g0f2e745e87
tree: command/unexplained/crush-location-json-mismatch
notes: |
  In rados/cephadm/workunits task/test_set_mon_crush_locations, the test verifies
  that monitor CRUSH locations configured in mon.yaml are applied by running
  'ceph mon dump --format json' and checking each monitor with jq using
  '.mons | .[] | select(.name == $monid) | .crush_location == $crushloc' where
  crushloc is a string formatted like '{datacenter=a}'.
  However, mon_info_t::dump() encodes crush_location as an array of key/val objects
  (e.g. [{"key":"datacenter","val":"a"}]), so the string comparison with jq returns
  false and causes jq to exit with status 1.
  Fixed by PR #67436 (commit 0f2e745e875), which updates the jq check in
  task/test_set_mon_crush_locations.yaml to query crush_location[].key and .val.
