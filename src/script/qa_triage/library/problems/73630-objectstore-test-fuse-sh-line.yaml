id: "73630"
tracker: https://tracker.ceph.com/issues/73630
title: "objectstore/test_fuse.sh: line 126: fusermount: command not found"
kind: infra
tree: workunit/set-e
facts:
  script: '^objectstore/test_fuse\.sh$'
match:
  reason: 'workunit test objectstore/test_fuse\.sh'
confirm:
  - file: teuthology.log
    pattern: 'objectstore/test_fuse\.sh: line \d+: fusermount: command not found'
notes: |
  qa/workunits/objectstore/test_fuse.sh mounts a bluestore store with
  ceph-objectstore-tool --op fuse, runs its checks, and ends with `fusermount -u $MNT`
  (line 126). The test nodes had no fusermount binary (the fuse package was not
  installed), so bash prints 'fusermount: command not found' and the workunit exits 127.
  The failed workunit is the symptom. The errors printed earlier, such as
  'rmdir: failed to remove ... Directory not empty' and 'mkdir: cannot create directory
  ... Invalid argument', are expected: the script wraps them in expect_false. David
  Galloway's fix is ceph-cm-ansible PR 816, which installs the missing package, so
  jobs that ran before it was deployed still fail this way. The tracker was moved to the
  Infrastructure project and resolved.
examples:
