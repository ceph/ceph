id: "74873"
tracker: https://tracker.ceph.com/issues/74873
title: "cephadm/test_iscsi_setup.sh - Auth: ACL_ENABLED, Hosts: 0"
kind: test
match:
  reason: 'workunit test cephadm/test_iscsi_setup\.sh'
confirm:
  - file: teuthology.log*
    pattern: 'Gateway \S+ not visible in gwcli after create; failing early'
notes: |
  In qa/workunits/cephadm/test_iscsi_setup.sh, after creating an iSCSI gateway via gwcli,
  wait_for_ls_contains fails to see the gateway hostname in '/iscsi-targets/.../gateways ls'
  within the retry limit (30 seconds). The script logs 'Gateway <hostname> not visible in
  gwcli after create; failing early.', runs dump_gwcli_state, and exits with status 1.
  Root cause is the same FQDN mismatch as #74577: rbd-target-api rejects the gateway
  creation with HTTP 400 because the hostname supplied by gwcli (resolved on the host)
  does not match the container's socket.getfqdn(), so the gateway never appears in gwcli.
