id: "75218"
tracker: https://tracker.ceph.com/issues/75218
title: "Orchestrater test fails while waiting for 8 OSDs to deploy"
kind: test
fixes:
  - pr: https://github.com/ceph/ceph/pull/67953
    branch: main
    fixed_in: v21.0.0-344-g93aa3cb449
tree: timeout
facts:
  task: '^cephadm$'
  wait: '^MaxWhileTries$'
match:
  reason: 'reached maximum tries'
confirm:
  - file: teuthology.log
    pattern: 'tasks\.cephadm:Waiting for \d+ OSDs to come up\.\.\.'
  - file: teuthology.log
    pattern: 'in ceph_osds'
notes: |
  In rados/cephadm/osds with 2-ops/deploy-raw, the cephadm task deploys OSDs using
  `ceph orch apply osd --all-available-devices --method raw` and then waits for all
  scratch devices to become up OSDs with `ceph osd stat -f json` in a safe_while
  loop (sleep=1, tries=120) logging "Waiting for N OSDs to come up...".
  When raw OSDs are deployed without first wiping disks that previously had partitions
  or signatures, some devices are not created as OSDs (e.g. only 7 of 8 come up),
  causing `ceph_osds` to time out after 120 seconds and raise `MaxWhileTries`.
  PR 67953 fixes this in main (v21.0.0-344-g93aa3cb449) by ensuring disks are wiped
  before raw OSD deployment.
