<div class="mb-3">
  @if (props.label) {
    <legend
      class="cd-header mt-1"
      i18n
    >
      {{ props.label }}
    </legend>
  }
  @if (props.description) {
    <p i18n>
      {{ props.description }}
    </p>
  }

  @for (field of field.fieldGroup; track field; let i = $index) {
    <div class="d-flex">
      <formly-field
        class="col"
        [field]="field"
      ></formly-field>
      <div class="action-btn">
        <button
          class="btn btn-light ms-1"
          type="button"
          (click)="addWrapper()"
        >
          <i [ngClass]="icons.add"></i>
        </button>
        @if (field.props.removable !== false) {
          <button
            class="btn btn-light ms-1"
            type="button"
            (click)="remove(i)"
          >
            <i [ngClass]="icons.trash"></i>
          </button>
        }
      </div>
    </div>
  }
  @if (field.fieldGroup.length === 0) {
    <div class="text-right">
      <button
        class="btn btn-light"
        type="button"
        (click)="addWrapper()"
        i18n
      >
        <i [ngClass]="icons.add"></i>
        Add {{ props.label }}
      </button>
    </div>
  }

  @if (showError && formControl.errors) {
    <span
      class="invalid-feedback"
      role="alert"
    >
      <formly-validation-message [field]="field"></formly-validation-message>
    </span>
  }
</div>
