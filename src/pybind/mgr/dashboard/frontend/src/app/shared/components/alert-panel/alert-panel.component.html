<cds-actionable-notification
  class="mb-1 content-theme"
  [ngClass]="spacingClass"
  [notificationObj]="notificationContent"
  (close)="onClose()"
></cds-actionable-notification>

<ng-template #content>
  @if (showTitle && alertTitle) {
    <span class="cds--actionable-notification__title">{{ alertTitle }}</span>
  }
  <ng-content></ng-content>
</ng-template>

<ng-template #actionTpl>
  @if (actionName) {
    <button
      cdsActionableButton
      cdsButton="ghost"
      size="md"
      [title]="actionName"
      (click)="onAction()"
      type="button"
      i18n
    >
      {{ actionName }}
    </button>
  }
</ng-template>
