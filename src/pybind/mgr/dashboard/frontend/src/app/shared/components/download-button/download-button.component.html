<div
  ngbDropdown
  placement="bottom-right"
>
  <button
    type="button"
    [title]="title"
    class="btn btn-light dropdown-toggle-split"
    ngbDropdownToggle
  >
    <svg
      [cdsIcon]="icons.download"
    ></svg
    >&nbsp;
  </button>
  <div ngbDropdownMenu>
    <button
      ngbDropdownItem
      (click)="download('json')"
      type="button"
      *ngIf="objectItem"
    >
      <svg
        [cdsIcon]="icons.code"
      ></svg>
      <span>&nbsp;JSON</span>
    </button>
    <button
      ngbDropdownItem
      (click)="download()"
      *ngIf="textItem"
      type="button"
    >
      <svg
        [cdsIcon]="icons.document"
      ></svg>
      <span>&nbsp;Text</span>
    </button>
  </div>
</div>
