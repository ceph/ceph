@if (expanded && overlay) {
  <div
    class="overlay"
    (click)="close()"
    tabindex="0"
    (keydown.enter)="close()"
  ></div>
}

<cds-panel
  [expanded]="expanded"
  [attr.panel-size]="size"
  [cdsLayer]="layer"
  [cdsTheme]="theme"
>
  <div>
    <cds-icon-button
      kind="ghost"
      class="float-end"
      title="Close"
      i18n-title
      (click)="close()"
    >
      <svg cdsIcon="close"></svg>
    </cds-icon-button>
    @if (headerText) {
      <div class="panel-header">
        <p class="cds--type-heading-03">{{ headerText }}</p>
        <ng-content select="[panel-header-description]"></ng-content>
      </div>
    }
  </div>
  <ng-content select=".panel-content"></ng-content>
  <ng-content select=".panel-footer"></ng-content>
</cds-panel>
