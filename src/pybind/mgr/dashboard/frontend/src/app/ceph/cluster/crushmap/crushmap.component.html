<div class="row">
  <div class="col-sm-12 col-lg-12">
    <div class="card">
      <div
        class="card-header"
        i18n
      >
        CRUSH map viewer
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-sm-6 col-lg-6 tree-container">
            @if (loadingIndicator) {
              <cds-loading
                [isActive]="true"
                [overlay]="false"
                size="sm"
              ></cds-loading>
            }
            <cds-tree-view
              #tree
              [isMultiSelect]="false"
              (select)="onNodeSelected($event)"
            >
              <ng-template
                #nodeTemplateRef
                let-node="node"
                let-depth="depth"
              >
                <cds-tree-node
                  [node]="node"
                  [depth]="depth"
                >
                  @if (node?.children && node?.children?.length) {
                    @for (child of node.children; track child; let i = $index) {
                      <!-- Increase the depth by 1 -->
                      <ng-container
                        *ngTemplateOutlet="
                          nodeTemplateRef;
                          context: { node: child, depth: depth + 1 }
                        "
                      >
                      </ng-container>
                    }
                  }
                </cds-tree-node>
              </ng-template>
              <ng-template
                #tag
                let-data
              >
                @if (data?.status) {
                  <cds-tag [class]="getStatusClasses(data.status)">
                    {{ data?.status }}
                  </cds-tag>
                }
                <span>&nbsp;</span>
                <span
                  class="node-name"
                  [ngClass]="{ 'type-osd': data?.type === 'osd' }"
                  [innerHTML]="data?.name"
                ></span>
              </ng-template>
              @for (node of nodes; track node) {
                <ng-container
                  *ngTemplateOutlet="nodeTemplateRef; context: { node: node, depth: 0 }"
                >
                </ng-container>
              }
            </cds-tree-view>
          </div>
          @if (metadata) {
            <div class="col-sm-6 col-lg-6 metadata">
              <legend>{{ metadataTitle }}</legend>
              <div>
                <cd-table-key-value [data]="metadata"></cd-table-key-value>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
