<cd-iscsi-tabs></cd-iscsi-tabs>

@if (available === false) {
  <cd-alert-panel
    type="info"
    alertTitle="iSCSI Targets not available"
    i18n-alertTitle
  >
    <ng-container i18n
      >Please consult the&nbsp;<cd-doc section="iscsi"></cd-doc>&nbsp;on how to configure and enable
      the iSCSI Targets management functionality.</ng-container
    >
    @if (status) {
      <br />
      <span i18n>Available information:</span>
      <pre>{{ status }}</pre>
    }
  </cd-alert-panel>
}

@if (available === true) {
  <cd-table
    #table
    [data]="targets"
    columnMode="flex"
    [columns]="columns"
    identifier="target_iqn"
    forceIdentifier="true"
    selectionType="single"
    [hasDetails]="true"
    [autoReload]="false"
    [status]="tableStatus"
    (fetchData)="getTargets()"
    (setExpandedRow)="setExpandedRow($event)"
    (updateSelection)="updateSelection($event)"
  >
    <div class="table-actions">
      <cd-table-actions
        class="btn-group"
        [permission]="permission"
        [selection]="selection"
        [tableActions]="tableActions"
      >
      </cd-table-actions>
      <button
        class="btn btn-light"
        type="button"
        (click)="configureDiscoveryAuth()"
      >
        <svg
          [cdsIcon]="icons.key"
          [size]="icons.size16"
        ></svg>
        <ng-container i18n>Discovery authentication</ng-container>
      </button>
    </div>
    @if (expandedRow) {
      <cd-iscsi-target-details
        *cdTableDetail
        [cephIscsiConfigVersion]="cephIscsiConfigVersion"
        [selection]="expandedRow"
        [settings]="settings"
      ></cd-iscsi-target-details>
    }
  </cd-table>
}
