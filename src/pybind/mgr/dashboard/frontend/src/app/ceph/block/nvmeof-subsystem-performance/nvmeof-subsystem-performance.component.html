@if (permissions.grafana.read && subsystemNQN && groupName) {
  <cd-grafana
    i18n-title
    title="Subsystem details"
    grafanaPath="ceph-nvme-of-gateways-performance?var-group={{ groupName }}&var-subsystem={{
      subsystemNQN
    }}"
    [type]="'metrics'"
    uid="feeuv1dno43r4deed"
    grafanaStyle="three"
  >
  </cd-grafana>
}

@if (!permissions.grafana.read) {
  <cd-helper i18n> Grafana permissions are required to view performance details. </cd-helper>
}
