@if (selection) {
  @switch (section) {
    @case ('overview') {
      <cd-resource-overview-card
        i18n-title
        title="Cluster settings"
        [columns]="4"
        [fields]="overviewFields"
        [showFooter]="true"
      >
        <div footer>
          <a
            cdsLink
            (click)="openPerformanceLimits()"
            href="javascript:void(0)"
            i18n
            >Configure performance limits</a
          >
        </div>
      </cd-resource-overview-card>

      <section class="cds-mt-6">
        <cd-nfs-list [clusterId]="selection.name"></cd-nfs-list>
      </section>

      <cd-side-panel
        [expanded]="isPerformanceLimitsOpen"
        headerText="Configure performance limits"
        i18n-headerText
        size="md"
        (closed)="closePerformanceLimits()"
      >
        <div
          panel-header-description
          class="cds--type-body-01"
        >
          <span i18n>Set limits for the I/O generated by NFS clients and shares.</span>
        </div>
        <div class="panel-content">
          @if (isPerformanceLimitsOpen) {
            <cd-nfs-rate-limit-form
              [action]="actionLabels.EDIT"
              [isEdit]="true"
              [type]="'cluster'"
              [clusterDataConfig]="qos"
            ></cd-nfs-rate-limit-form>
          }
        </div>
        <div class="panel-footer">
          <button
            cdsButton="secondary"
            size="xl"
            type="button"
            (click)="closePerformanceLimits()"
            i18n
          >
            Cancel
          </button>
          <button
            cdsButton="primary"
            size="xl"
            type="button"
            [disabled]="isSaving"
            (click)="savePerformanceLimits()"
            i18n
          >
            Save
          </button>
        </div>
      </cd-side-panel>
    }
  }
} @else if (loadError) {
  <cd-alert-panel
    type="error"
    i18n
    >No NFS cluster found.</cd-alert-panel
  >
}
