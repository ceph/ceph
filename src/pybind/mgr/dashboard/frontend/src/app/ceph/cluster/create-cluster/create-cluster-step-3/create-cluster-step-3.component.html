<div
  cdsGrid
  [useCssGrid]="true"
  [narrow]="true"
  [fullWidth]="true"
>
  <div
    cdsCol
    [columnNumbers]="{ sm: 4, md: 8, lg: 16 }"
  >
    <h4 i18n>Create Services</h4>

    <cd-services
      [hasDetails]="false"
      [hiddenServices]="['mon', 'mgr', 'crash', 'agent']"
      [hiddenColumns]="['status', 'status.last_refresh', 'status.ports', 'certificate.status']"
      [routedModal]="false"
    ></cd-services>
  </div>
</div>
