<cds-modal
  size="md"
  [open]="open"
  [hasScrollingContent]="false"
  (overlaySelected)="closeModal()"
>
  <cds-modal-header (closeSelect)="closeModal()">
    <h4
      cdsModalHeaderLabel
      class="cds--type-label-01"
      i18n
    >
      {{ roleName || 'Role' }}
    </h4>
    <h3
      *ngIf="!isEdit"
      cdsModalHeaderHeading
      i18n
    >
      Attach permission policy
    </h3>
    <h3
      *ngIf="isEdit"
      cdsModalHeaderHeading
      i18n
    >
      Edit ‘{{ policyName }}’ permission
    </h3>
    <p
      class="cds--modal-header__description cds--type-body-01 cds-mt-3"
      i18n
    >
      Description
    </p>
  </cds-modal-header>

  <form
    class="form"
    #formDir="ngForm"
    [formGroup]="form"
  >
    <div cdsModalContent>
      <!-- Policy Name -->
      <div class="form-item">
        <cds-text-label
          for="policy_name"
          [invalid]="policyNameRef.isInvalid"
          [invalidText]="policyNameError"
          helperText="Unique name to identify this permission policy (e.g. S3FullAccessPolicy)."
          i18n-helperText
        >
          Policy name
          <input
            cdsText
            cdValidate
            #policyNameRef="cdValidate"
            id="policy_name"
            name="policy_name"
            formControlName="policy_name"
            placeholder="Enter policy name"
            [readonly]="isEdit"
            [autofocus]="!isEdit"
            modal-primary-focus
          />
        </cds-text-label>
        <ng-template #policyNameError>
          <span
            *ngIf="form.showError('policy_name', formDir, 'required')"
            class="invalid-feedback"
            i18n
            >This field is required.</span
          >
        </ng-template>
      </div>

      <!-- Policy Document (JSON) -->
      <div class="form-item">
        <cds-textarea-label
          labelInputID="policy_doc"
          [invalid]="policyDoc.isInvalid"
          [invalidText]="policyError"
          helperText="JSON document defining the permissions policy statement."
          i18n-helperText
        >
          JSON
          <textarea
            cdsTextArea
            cdValidate
            #policyDoc="cdValidate"
            id="policy_doc"
            name="policy_doc"
            formControlName="policy_doc"
            placeholder='{\n  "Version": "2012-10-17",\n  "Statement": [\n    {\n      "Effect": "Allow",\n      "Action": ["s3:GetObject"],\n      "Resource": ["arn:aws:s3:::*"]\n    }\n  ]\n}'
            rows="12"
            cols="200"
            cdRequiredField="Policy Document"
          ></textarea>
        </cds-textarea-label>
        <ng-template #policyError>
          <span
            *ngIf="form.showError('policy_doc', formDir, 'required')"
            class="invalid-feedback"
            i18n
            >This field is required.</span
          >
          <span
            *ngIf="form.showError('policy_doc', formDir, 'invalidJson')"
            class="invalid-feedback"
            i18n
            >Please enter a valid JSON policy document.</span
          >
        </ng-template>
      </div>
    </div>

    <cds-modal-footer>
      <button
        cdsButton="secondary"
        (click)="closeModal()"
        type="button"
        i18n
      >
        Cancel
      </button>
      <button
        *ngIf="isEdit"
        cdsButton="danger"
        (click)="deletePolicy()"
        type="button"
        i18n
      >
        Delete
        <svg
          [cdsIcon]="icons.trash"
          [size]="icons.size16"
          class="cds--btn__icon"
        ></svg>
      </button>
      <button
        cdsButton="primary"
        (click)="onSubmit()"
        type="submit"
        [disabled]="form.invalid"
        i18n
      >
        {{ isEdit ? 'Update' : 'Attach' }}
      </button>
    </cds-modal-footer>
  </form>
</cds-modal>
