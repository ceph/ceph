<div class="row">
  <div class="col-6 card-tree">
    <legend i18n>iSCSI Topology</legend>

    <cds-tree-view
      #tree
      [tree]="nodes"
      (select)="onNodeSelected($event)"
    >
    </cds-tree-view>
    <ng-template
      #treeNodeTemplate
      let-node
    >
      {{ node?.data?.cdIcon }}
      <svg
        [cdsIcon]="node?.data?.cdIcon"
        [size]="icons.size16"
      ></svg>
      <span>{{ node?.name }}</span>
      &nbsp;
      <cds-tag
        [class]="{
          'tag-success': ['logged_in'].includes(node?.status),
          'tag-danger': ['logged_out'].includes(node?.status)
        }"
      >
        {{ node?.status }}
      </cds-tag>
    </ng-template>
  </div>

  @if (data) {
    <div class="col-6 metadata">
      <legend>{{ title }}</legend>
      <cd-table
        #detailTable
        [data]="data"
        columnMode="flex"
        [columns]="columns"
        [limit]="0"
      >
      </cd-table>
    </div>
  }
</div>

<ng-template
  #highlightTpl
  let-row="data.row"
  let-value="data.value"
>
  @if (row.default === undefined || row.default === row.current) {
    <span>{{ value }}</span>
  }
  @if (row.default !== undefined && row.default !== row.current) {
    <strong>{{ value }}</strong>
  }
</ng-template>
