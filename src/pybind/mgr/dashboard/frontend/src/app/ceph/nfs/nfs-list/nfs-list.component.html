<cd-table
  #table
  [data]="exports"
  columnMode="flex"
  [columns]="columns"
  identifier="id"
  forceIdentifier="true"
  selectionType="single"
  [hasDetails]="false"
  (setExpandedRow)="setExpandedRow($event)"
  (updateSelection)="updateSelection($event)"
>
  <div class="table-actions">
    <cd-table-actions
      class="btn-group"
      [permission]="permission"
      [selection]="selection"
      [tableActions]="tableActions"
    >
    </cd-table-actions>
  </div>

  <cd-nfs-details
    *cdTableDetail
    [selection]="expandedRow"
  >
  </cd-nfs-details>
</cd-table>

<ng-template
  #nfsFsal
  let-value="data.value"
>
  @if (value.name === 'CEPH') {
    <ng-container i18n>CephFS</ng-container>
  }
  @if (value.name === 'RGW') {
    <ng-container i18n>Object Gateway</ng-container>
  }
</ng-template>

<ng-template
  #protocolTpl
  let-protocols="data.value"
>
  @for (protocol of protocols; track protocol) {
    <span>
      <cds-tag size="md">NFSv{{ protocol }}</cds-tag>
    </span>
  }
</ng-template>

<ng-template
  #transportTpl
  let-transports="data.value"
>
  @for (transport of transports; track transport) {
    <span>
      <cds-tag size="md">{{ transport }}</cds-tag>
    </span>
  }
</ng-template>

<ng-template
  #pathTmpl
  let-value="data.value"
>
  @if (value === '') {
    <span
      i18n
      i18n-ngbTooltip
      ngbTooltip="All buckets owned by user"
      >*</span
    >
  }
  @if (value !== '') {
    <span>{{ value }}</span>
  }
</ng-template>
