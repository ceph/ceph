<nav
  ngbNav
  #nav="ngbNav"
  class="nav-tabs"
  cdStatefulTab="image-list"
>
  <ng-container ngbNavItem="issues">
    <a
      ngbNavLink
      i18n
      >Issues ({{ image_error.data.length }})</a
    >
    <ng-template ngbNavContent>
      <cd-table
        [data]="image_error.data"
        columnMode="flex"
        [columns]="image_error.columns"
        identifier="name"
        forceIdentifier="true"
        [autoReload]="-1"
        (fetchData)="refresh()"
        [status]="tableStatus"
      >
      </cd-table>
    </ng-template>
  </ng-container>
  <ng-container ngbNavItem="syncing">
    <a
      ngbNavLink
      i18n
      >Syncing ({{ image_syncing.data.length }})</a
    >
    <ng-template ngbNavContent>
      <cd-table
        [data]="image_syncing.data"
        columnMode="flex"
        [columns]="image_syncing.columns"
        identifier="name"
        forceIdentifier="true"
        [autoReload]="-1"
        (fetchData)="refresh()"
        [status]="tableStatus"
      >
      </cd-table>
    </ng-template>
  </ng-container>
  <ng-container ngbNavItem="ready">
    <a
      ngbNavLink
      i18n
      >Ready ({{ image_ready.data.length }})</a
    >
    <ng-template ngbNavContent>
      <cd-table
        [data]="image_ready.data"
        columnMode="flex"
        [columns]="image_ready.columns"
        identifier="name"
        forceIdentifier="true"
        [autoReload]="-1"
        (fetchData)="refresh()"
        [status]="tableStatus"
      >
      </cd-table>
    </ng-template>
  </ng-container>
</nav>

<div [ngbNavOutlet]="nav"></div>

<ng-template
  #stateTmpl
  let-row="data.row"
  let-value="data.value"
>
  <cds-tag
    size="sm"
    [class]="row.state_color | mirrorHealthColor"
    >{{ value }}</cds-tag
  >
</ng-template>

<ng-template
  #progressTmpl
  let-row="data.row"
  let-value="data.value"
>
  @if (row.state === 'Replaying') {
    <div></div>
  }
  <div class="w-100 h-100 d-flex justify-content-center align-items-center">
    @if (row.state === 'Replaying') {
      <ngb-progressbar
        type="info"
        class="w-100"
        [value]="value"
        [showValue]="true"
      ></ngb-progressbar>
    }
  </div>
</ng-template>

<ng-template
  #entriesBehindPrimaryTpl
  let-row="data.row"
  let-value="data.value"
>
  @if (row.mirror_mode === 'journal') {
    <span>
      {{ value }}
    </span>
  }
  @if (row.mirror_mode === 'snapshot') {
    <span ngbTooltip="Not available with mirroring snapshot mode">-</span>
  }
</ng-template>
