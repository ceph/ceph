<cd-table
  [data]="data"
  (fetchData)="getConfigurationList($event)"
  [columns]="columns"
  [extraFilterableColumns]="filters"
  selectionType="single"
  [hasDetails]="true"
  (setExpandedRow)="setExpandedRow($event)"
  (updateSelection)="updateSelection($event)"
>
  <cd-table-actions
    class="table-actions"
    [permission]="permission"
    [selection]="selection"
    [tableActions]="tableActions"
  >
  </cd-table-actions>
  <cd-configuration-details
    *cdTableDetail
    [selection]="expandedRow"
  >
  </cd-configuration-details>
</cd-table>

<ng-template
  #confValTpl
  let-value="data.value"
>
  @if (value) {
    <span>
      @for (conf of value; track conf; let isLast = $last) {
        <span> {{ conf.section }}: {{ conf.value }}{{ !isLast ? ',' : '' }}<br /> </span>
      }
    </span>
  }
</ng-template>
