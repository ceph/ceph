<div
  cdsGrid
  [useCssGrid]="true"
  [narrow]="true"
  [fullWidth]="true"
  class="cds-py-4 role-details-container"
>
  <!-- Left Column: Role ARN & Path -->
  <div
    cdsCol
    cdsStack="vertical"
  >
    <div class="cds-mb-4">
      <div
        class="cds--type-heading-01 cds-mb-1"
        i18n
      >
        Role ARN
      </div>
      <div class="cds--type-body-compact-01">
        {{ roleArn || '-' }}
      </div>
    </div>
    <div>
      <div
        class="cds--type-heading-01 cds-mb-1"
        i18n
      >
        Path
      </div>
      <div class="cds--type-body-compact-01">
        {{ rolePath || '/' }}
      </div>
    </div>
  </div>

  <!-- Right Column: Permission policies -->
  <div
    cdsCol
    cdsStack="vertical"
  >
    <div
      cdsStack="horizontal"
      [gap]="1"
      class="cds-mb-2"
      style="justify-content: flex-start; align-items: center"
    >
      <span
        class="cds--type-heading-01"
        i18n
      >
        Permission policies
      </span>
      <cd-helper i18n> Inline policies attached to this role. </cd-helper>
    </div>

    <ng-container *ngIf="policies$ | async as policies">
      <div
        *ngIf="policies.length === 0"
        class="cds--type-body-compact-01 text-muted"
        i18n
      >
        There are no permission policies attached.
      </div>

      <div
        *ngFor="let policy of policies"
        cdsStack="horizontal"
        [gap]="1"
        class="cds-mb-2"
        style="justify-content: flex-start; align-items: center"
      >
        <span class="cds--type-body-compact-01">
          {{ policy.name }}
        </span>
        <cds-icon-button
          kind="ghost"
          size="sm"
          title="Edit or delete the permission policy."
          i18n-title
          (click)="openEditPolicyModal(policy.name); $event.stopPropagation()"
        >
          <svg
            [cdsIcon]="icons.edit"
            [size]="icons.size16"
            class="cds--btn__icon"
          ></svg>
        </cds-icon-button>
      </div>
    </ng-container>
  </div>
</div>
