<ng-template #descTpl
  >Filesystem: <strong>{{ fsName }}</strong></ng-template
>

<cd-tearsheet
  [steps]="steps"
  [title]="title"
  [modalHeaderLabel]="modalHeaderLabel"
  [descriptionTemplate]="descTpl"
  [isSubmitLoading]="isSubmitLoading"
  progressPosition="top"
  submitButtonLabel="Add mirror path"
  i18n-submitButtonLabel
  (submitRequested)="onSubmit()"
  (closeRequested)="onCancel()"
  (stepChanged)="onStepChanged($event)"
>
  <cd-tearsheet-step>
    <cd-mirroring-paths-step
      #pathsStep
      #tearsheetStep
      [fsName]="fsName"
      [fsId]="fsId"
    >
    </cd-mirroring-paths-step>
  </cd-tearsheet-step>
  <cd-tearsheet-step [stepValid]="scheduleStepValid">
    @if ((snapScheduleModuleStatus$ | async) === false) {
      <cd-alert-panel
        type="info"
        spacingClass="mb-3"
        i18n
        class="align-items-center"
        actionName="Enable"
        (action)="enableSnapshotSchedule()"
      >
        In order to create a snapshot schedule, the snap_schedule module must be enabled
      </cd-alert-panel>
    } @else {
      <cd-cephfs-snapshotschedule-form
        #scheduleStep
        #tearsheetStep
        [embedded]="true"
        [hideDirectory]="true"
        [fsNameInput]="fsName"
        [fsIdInput]="fsId"
        [schedulePath]="schedulePath"
      >
      </cd-cephfs-snapshotschedule-form>
    }
  </cd-tearsheet-step>
  <cd-tearsheet-step>
    <cd-mirroring-review-step
      #tearsheetStep
      [fsName]="fsName"
      [totalPaths]="reviewTotalPaths"
      [selectedPaths]="reviewSelectedPaths"
      [snapshotInterval]="reviewSnapshotInterval"
      [retention]="reviewRetention"
    >
    </cd-mirroring-review-step>
  </cd-tearsheet-step>
</cd-tearsheet>
