<div class="timeSelector">
  <select
    id="timepicker"
    name="timepicker"
    [(ngModel)]="time"
    (ngModelChange)="emitTime()"
    class="form-select"
  >
    @for (key of times; track key) {
      <option [ngValue]="key.value">
        {{ key.name }}
      </option>
    }
  </select>
</div>
