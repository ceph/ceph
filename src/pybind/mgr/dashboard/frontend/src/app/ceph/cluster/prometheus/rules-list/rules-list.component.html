<cd-prometheus-tabs></cd-prometheus-tabs>

@if (!isPrometheusConfigured) {
  <cd-alert-panel
    type="info"
    i18n
    >To see all configured Prometheus alerts, please provide the URL to the API of Prometheus as
    described in the &nbsp;<cd-doc section="prometheus"></cd-doc>.</cd-alert-panel
  >
}

@if (isPrometheusConfigured) {
  <cd-table
    [data]="rules"
    [columns]="columns"
    [selectionType]="'single'"
    [hasDetails]="true"
    (setExpandedRow)="setExpandedRow($event)"
    (updateSelection)="updateSelection($event)"
  >
    @if (expandedRow) {
      <cd-table-key-value
        *cdTableDetail
        [data]="expandedRow"
        [renderObjects]="true"
        [hideKeys]="hideKeys"
      >
      </cd-table-key-value>
    }
  </cd-table>
}
