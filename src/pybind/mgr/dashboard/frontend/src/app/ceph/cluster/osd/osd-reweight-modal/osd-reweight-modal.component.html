<cd-modal [modalRef]="activeModal">
  <ng-container
    class="modal-title"
    i18n
    >Reweight OSD: {{ osdId }}</ng-container
  >

  <ng-container class="modal-content">
    <form [formGroup]="reweightForm">
      <div class="modal-body">
        <div class="row">
          <label
            for="weight"
            class="cd-col-form-label"
            >Weight</label
          >
          <div class="cd-col-form-input">
            <input
              id="weight"
              class="form-control"
              type="number"
              step="0.1"
              formControlName="weight"
              min="0"
              max="1"
              [value]="currentWeight"
            />
            @if (weight.errors) {
              <span class="invalid-feedback">
                @if (weight.errors?.required) {
                  <span i18n>This field is required.</span>
                }
                @if (weight.errors?.max || weight.errors?.min) {
                  <span i18n>The value needs to be between 0 and 1.</span>
                }
              </span>
            }
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <cd-form-button-panel
          (submitActionEvent)="reweight()"
          [form]="reweightForm"
          [submitText]="actionLabels.REWEIGHT"
        ></cd-form-button-panel>
      </div>
    </form>
  </ng-container>
</cd-modal>
