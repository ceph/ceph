@if (orchStatus?.available) {
  <cd-table
    headerTitle="Service clusters"
    [autoReload]="5000"
    [data]="clusters$ | async"
    identifier="name"
    columnMode="flex"
    [columns]="columns"
    selectionType="single"
    emptyStateTitle="No service clusters created."
    i18n-emptyStateTitle
    emptyStateMessage="Create a service cluster to host and manage your file shares."
    i18n-emptyStateMessage
    (fetchData)="loadData()"
    (updateSelection)="updateSelection($event)"
  >
    <cd-table-actions
      class="table-actions"
      [selection]="selection"
      [permission]="permission"
      [tableActions]="tableActions"
    ></cd-table-actions>
  </cd-table>
}

<ng-template
  #statusTpl
  let-row="data.row"
  let-column="data.column"
  let-value="data.value"
>
  @if (value === '-') {
    <a [routerLink]="row.eventsLink">-</a>
  } @else {
    <cds-tag [class]="'table-tag ' + column.customTemplateConfig.map[value].class">
      {{ value }}
    </cds-tag>
  }
</ng-template>
