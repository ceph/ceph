@if (orchStatus?.available) {
  <cd-table
    headerTitle="Service clusters"
    [autoReload]="5000"
    [data]="clusters$ | async"
    columnMode="flex"
    [columns]="columns"
    selectionType="single"
    emptyStateTitle="No service clusters created."
    i18n-emptyStateTitle
    emptyStateMessage="Create a service cluster to host and manage your file shares."
    i18n-emptyStateMessage
    (fetchData)="loadData()"
    (updateSelection)="updateSelection($event)"
  >
  </cd-table>
}
