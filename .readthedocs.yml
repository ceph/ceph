---
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2
formats: []
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - ditaa
    - graphviz
    - ant
    - default-jdk-headless
  jobs:
    post_build:
      - >-
        ant -buildfile src/java/build.xml
        -Ddoc.dir="$(realpath "$READTHEDOCS_OUTPUT/html")/cephfs/api/libcephfs-java/javadoc"
        docs
      - test -s "$READTHEDOCS_OUTPUT/html/cephfs/api/libcephfs-java/javadoc/index.html"
python:
  install:
    - requirements: admin/doc-requirements.txt
    - requirements: admin/doc-read-the-docs.txt
    - requirements: admin/doc-pybind.txt
sphinx:
  builder: dirhtml
  configuration: doc/conf.py
  fail_on_warning: true
