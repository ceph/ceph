# Kernels before Linux 7.0 cannot load aes256k cephx keys (the default), which
# breaks the kernel rbd map. Ubuntu 22.04 is such a kernel; CentOS Stream 9 is not.
# See https://tracker.ceph.com/issues/81231
teuthology:
  postmerge:
    - if yaml.os_type == "ubuntu" then reject() end

overrides:
  ceph:
    conf:
      global:
        ms die on skipped message: false
      client:
        rbd default features: 5
tasks:
- ceph:
    log-ignorelist:
      - \(POOL_APP_NOT_ENABLED\)
- rbd:
    all:
      image_size: 20480
- workunit:
    clients:
      all:
        - suites/iozone.sh
