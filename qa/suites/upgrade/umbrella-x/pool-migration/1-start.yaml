overrides:
  ceph:
    log-ignorelist:
      - do not have an application enabled
      - application not enabled
      - or freeform for custom applications
      - POOL_APP_NOT_ENABLED
      - is down
      - OSD_DOWN
      - mons down
      - mon down
      - MON_DOWN
      - out of quorum
      - PG_AVAILABILITY
      - PG_DEGRADED
      - Reduced data availability
      - Degraded data redundancy
      - pg .* is stuck inactive
      - pg .* is stuck undersized
      - pg .* is .*degraded
      - FS_DEGRADED
      - OSDMAP_FLAGS
      - OSD_UPGRADE_FINISHED
      - pg .* is stuck peering
      - Replacing daemon mds
      - MDS_ALL_DOWN
      - MDS_UP_LESS_THAN_MAX
      - filesystem is offline
      - with fewer MDS than max_mds
      - filesystem is degraded
      - osds down
      - osd down
      - OBJECT_UNFOUND
      - OSD_HOST_DOWN
      - PG_DAMAGED
      - CEPHADM_FAILED_DAEMON
      - failed cephadm daemon
      - osd.* is in unknown state
      - POOL_FULL
      - pool full
      - pool\(s\) full
      - but it is still running
      - POOL_MIGRATION_INCOMPATIBLE_CLIENTS
      - POOL_MIGRATING_WITH_INCOMPATIBLE_CLIENTS
      - can.t follow a pool migration
      - POOL_MIGRATION
tasks:
- install:
    branch: umbrella
    exclude_packages:
      - ceph-osd-classic
      - ceph-volume
      - ceph-osd-crimson

- cephadm:
    image: quay.ceph.io/ceph-ci/ceph:umbrella
    compiled_cephadm_branch: umbrella
    conf:
      osd:
        #set config option for which cls modules are allowed to be loaded / used
        osd_class_load_list: "*"
        osd_class_default_list: "*"

- cephadm.shell:
    mon.a:
      - ceph config set mon mon_warn_on_insecure_global_id_reclaim false --force
      - ceph config set mon mon_warn_on_insecure_global_id_reclaim_allowed false --force
      - ceph osd pool create data 32
      - ceph osd pool application enable data rados
      - rados -p data bench 30 write -b 65536 -t 8 --no-cleanup
      - rados -p data ls | wc -l

- ceph.healthy:
