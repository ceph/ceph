meta:
- desc: |
   the clients keep their umbrella packages: while one is connected,
   require_min_compat_client cannot be set to vampire without force, and its
   session then still blocks a migration; once it is gone a migration runs;
   umbrella clients are refused from the moment vampire is required, during
   the migration and after it
tasks:
- print: "**** an umbrella client writes, then stays connected"
- exec:
    client.1:
      - rados -p data put obj-before-the-migration /etc/hosts
      - nohup ceph -w > /tmp/old-watch.log 2>&1 & echo $! > /tmp/old-watch.pid
      - sleep 15
- cephadm.shell:
    mon.a:
      - ceph config set global enable_experimental_unrecoverable_data_corrupting_features poolmigration
      - sleep 20
      - if ceph osd pool migrate data 64 ; then echo migrated-without-the-requirement ; exit 1 ; fi
      - if ceph osd set-require-min-compat-client vampire ; then echo required-with-an-umbrella-client-connected ; exit 1 ; fi
      - ceph osd set-require-min-compat-client vampire --yes-i-really-mean-it
      - ceph osd dump | grep -w require_pool_migration
      - ceph health detail
      - if ceph health detail | grep INCOMPATIBLE_CLIENTS ; then echo unexpected-health-check ; exit 1 ; fi
      - if ceph osd pool migrate data 64 ; then echo migrated-with-an-umbrella-client-connected ; exit 1 ; fi
- print: "**** the umbrella client leaves and cannot come back"
- exec:
    client.1:
      - kill $(cat /tmp/old-watch.pid)
      - sleep 10
      - "! timeout 120 rados -p data ls"
- print: "**** the migration"
- cephadm.shell:
    mon.a:
      - sleep 20
      - ceph osd pool migrate data 64
      - ceph osd pool ls --show-all | grep migrate-1
      - rados -p data ls | wc -l
- exec:
    client.1:
      - "! timeout 120 rados -p data ls"
- cephadm.shell:
    mon.a:
      - while ceph osd pool ls detail -f json | jq -e 'map(select(.migration_src != null or .migration_target != null)) | length > 0' ; do sleep 15 ; done
      - ceph osd pool ls detail
      - rados -p data ls | wc -l
      - rados -p data stat obj-before-the-migration
- print: "**** after the migration: umbrella clients stay refused"
- exec:
    client.1:
      - "! timeout 120 rados -p data ls"
- ceph.healthy:
