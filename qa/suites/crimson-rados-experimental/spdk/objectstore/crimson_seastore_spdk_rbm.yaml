overrides:
  ceph:
    conf:
      osd:
        osd objectstore: seastore
        # SPDK drives a single device per OSD: no cache tier, and no lbc
        # test stress, which would create one.
        seastore data device type: SSD
        seastore data backend type: RANDOM_BLOCK
        seastore lbc test stress: false
        # each shard has a journal of this size in its share of the
        # device: keep it small enough for the scratch devices
        seastore cbjournal size: 1G
        debug seastore: 20
        debug seastore device: 20
        debug seastore journal: 20
        debug seastore cleaner: 20
        debug seastore epm: 20
