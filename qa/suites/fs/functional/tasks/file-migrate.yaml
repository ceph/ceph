overrides:
  ceph:
    log-ignorelist:
      - FS_DEGRADED
      - fs.*is degraded
      - MDS_ALL_DOWN
      - MDS_UP_LESS_THAN_MAX
      - MDS_DAMAGE
      - filesystem is offline
      - is offline because no MDS
      - evicting unresponsive client
      - client.*failing to respond
      - RECENT_CRASH
      - Replacing daemon mds
      - POOL_APP_NOT_ENABLED

tasks:
- exec:
    mon.a:
      - ceph config set mgr mgr/crash/warn_recent_interval 0
- cephfs_test_runner:
    fail_on_skip: false
    modules:
      - tasks.cephfs.test_file_migrate
