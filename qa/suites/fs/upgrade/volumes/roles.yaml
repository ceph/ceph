# client.0-2 each mount (and do IO in) one subvolume with subvolume-scoped
# caps; client.3 mounts the file system root to inspect the subvolume layout.
# The ceph-fuse client (client.1) is on a host of its own: the kclient and
# ceph-fuse tasks each clean up all the client network namespaces on the
# hosts of their clients, which breaks the other's mounts.
roles:
- - mon.a
  - mgr.x
  - client.1
  - osd.0
  - osd.1
  - osd.2
- - mon.b
  - mon.c
  - mgr.y
  - client.0
  - client.2
  - client.3
  - osd.3
  - osd.4
  - osd.5
