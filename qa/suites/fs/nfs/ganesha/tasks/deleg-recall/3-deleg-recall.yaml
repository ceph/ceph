overrides:
  # cephadm's ganesha config disables delegations
  ganesha-reconf:
    delegations: RW
tasks:
- ganesha-deleg-recall:
    cluster_id: nfs-ganesha-test
    nfs_client: client.0
    cephfs_client: client.1
    # see README
    known_failures:
      - read-deleg-vs-write
      - read-deleg-vs-setattr
      - write-deleg-vs-read
