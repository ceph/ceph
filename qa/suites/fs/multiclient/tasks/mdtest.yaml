# make sure we get the same MPI version on all hosts
tasks:
- pexec:
    clients:
      - set -x
      - cd $TESTDIR
      # The distro mpich lives in /usr/lib64/mpich and is normally set up via
      # environment modules. Build against it directly, with an rpath so the
      # binaries find libmpi without LD_LIBRARY_PATH.
      - sudo dnf install -y mpich mpich-devel wget bzip2 tree
      - export PATH=/usr/lib64/mpich/bin:$PATH
      # use ior project instead of mdtest project because latter has been
      # merged into former. See:
      # https://github.com/MDTEST-LANL/mdtest/blob/master/README.md
      - wget http://download.ceph.com/qa/ior-3.3.0.tar.bz2
      - tar xvfj ior-3.3.0.tar.bz2
      - cd ior-3.3.0
      # this option was set originall when mdtest binary was built using
      # mdtest PR and not through ior project.
      #- MPI_CC=mpicc make
      - ./configure LDFLAGS=-Wl,-rpath,/usr/lib64/mpich/lib
      - make
      - make install DESTDIR=$TESTDIR/binary/
      - cd $TESTDIR/
      - tree binary/
      - rm ior-3.3.0.tar.bz2
      - rm -r ior-3.3.0
      - ln -s $TESTDIR/mnt.* $TESTDIR/gmnt
      # The mpi task runs a bare "mpiexec", and hydra starts its proxy on the
      # other hosts from the directory mpiexec was found in.
      - sudo ln -sf /usr/lib64/mpich/bin/mpiexec /usr/bin/mpiexec
      - sudo ln -sf /usr/lib64/mpich/bin/hydra_pmi_proxy /usr/bin/hydra_pmi_proxy
- ssh_keys:
- mpi:
    # mpich uses libfabric (ch4:ofi). Keep it off the RDMA providers, which
    # may not work on the lab NICs.
    exec: -genv FI_PROVIDER tcp $TESTDIR/binary/usr/local/bin/mdtest -d $TESTDIR/gmnt -I 20 -z 5 -b 2 -R
- pexec:
    clients:
      - rm -f $TESTDIR/gmnt/ior.testfile
      - rm -f $TESTDIR/gmnt
      - rm -rf $TESTDIR/binary
      - sudo rm -f /usr/bin/mpiexec /usr/bin/hydra_pmi_proxy
