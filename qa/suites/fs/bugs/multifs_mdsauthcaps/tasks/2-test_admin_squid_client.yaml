teuthology:
  postmerge:
    # runs after the kclient mount fragment's postmerge, which picks aes256k
    # for upstream kernels: the client node stays on squid, whose mount.ceph
    # cannot parse aes256k keys
    - |
      local kclient = py_attrgetter(yaml.overrides).get('kclient')
      if kclient ~= nil then
        kclient.key_type = "aes"
      end
overrides:
  ceph:
    conf:
      global:
        lockdep: true
    log-ignorelist:
      - missing required features
      - \(MDS_CACHE_OVERSIZED\)
      - \(MDS_TRIM\)
      - \(MDS_CLIENTS_BROKEN_ROOTSQUASH\)
      - report clients with broken root_squash implementation
      - evicting unresponsive client
      - as file system flag refuse_client_session is set
tasks:
  - cephfs_test_runner:
      fail_on_skip: false
      modules:
        - tasks.cephfs.test_admin
