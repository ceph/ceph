# S3 GETs and PUTs out of band with the libfabric test clients, a soak of
# out-of-band GETs for five minutes, reads and pulled writes out of band
# from librados, then s3tests over HTTP (OOB_MODE strict). Every transfer
# of the clients must go out of band, except in the rxe jobs the librados
# client's, which speaks tcp on 127.0.0.1 only and skips. No GET of the
# soak may fail, and only those whose token is too small may fall back.
tasks:
- workunit:
    clients:
      client.0:
        - rgw/run-s3-oob.sh
        - rgw/run-s3-oob-soak.sh
        - rados/test_oob_read.sh
    env:
      OOB_MODE: strict
      SOAK_DURATION: "300"
- tox: [client.0]
- s3tests:
    client.0:
      rgw_server: client.0
overrides:
  ceph:
    conf:
      client:
        rgw crypt s3 kms backend: testing
        rgw crypt s3 kms encryption keys: testkey-1=YmluCmJvb3N0CmJvb3N0LWJ1aWxkCmNlcGguY29uZgo= testkey-2=aWIKTWFrZWZpbGUKbWFuCm91dApzcmMKVGVzdGluZwo=
        rgw crypt require ssl: false
        rgw sts key: AQA/3Fxpz2k2AxAAYWJjZGVmZ2hpamtsbW5vcA==
        rgw s3 auth use sts: true
  s3tests:
    accounts:
      iam root: RGW88888888888888888
      iam alt root: RGW99999999999999999
