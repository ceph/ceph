# PG growth: splits while transfers run
overrides:
  ceph:
    conf:
      osd:
        osd max backfills: 4
tasks:
- thrashosds:
    timeout: 1200
    chance_pgnum_grow: 2
    chance_pgpnum_fix: 1
    op_delay: 30
    min_in: 6
    min_live: 6
    chance_test_min_size: 0
    ceph_objectstore_tool: false
