overrides:
  ceph:
    conf:
      global:
        mon election default strategy: 3
    # in the configuration database, where enable_stretch_mode can change it
    cluster-conf:
      global:
        osd pool default size: 2
tasks:
- workunit:
    clients:
      client.0:
        - mon/setup_stretch_cluster.sh
- cephfs_test_runner:
    modules:
      - tasks.test_netsplit