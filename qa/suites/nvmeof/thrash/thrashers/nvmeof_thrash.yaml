overrides:
  ceph:
    log-ignorelist:  
      # general ignorelist
      - OSD_DOWN
      - osds down
      - OSD_HOST_DOWN
      - OSD_ROOT_DOWN
      - PG_DEGRADED
      - Degraded data redundancy
      # nvmeof daemon thrashing
      - CEPHADM_FAILED_DAEMON
      - NVMEOF_SINGLE_GATEWAY
      - have only 1 nvmeof gateway
      - has 1 gateway
      - NVMEOF_GATEWAY_DOWN
      - are in unavailable state
      - is unavailable
      - is in error state
      - failed cephadm daemon
      - CEPHADM_STRAY_DAEMON
      - stray daemon.* not managed by cephadm
      # https://tracker.ceph.com/issues/76988
      # ignore expected placement/apply failures when thrashing hosts/daemons
      - CEPHADM_DAEMON_PLACE_FAIL
      - Failed to place .* daemon
      - CEPHADM_APPLY_SPEC_FAIL
      - Failed to apply .* service
      - Cannot place .* Unknown hosts
      # https://tracker.ceph.com/issues/75452
      # ignore probe/refresh warnings during thrashing
      - CEPHADM_REFRESH_FAILED
      - failed to probe daemons or devices

tasks:
- nvmeof.thrash:
    checker_host: 'client.0'
    randomize: False
