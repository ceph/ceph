tasks:
- nvmeof:
    installer: host.a
    gw_image: default # "default" is the image cephadm defaults to; change to test specific nvmeof images, example "latest"
    rbd:
      pool_name: mypool
      image_name_prefix: myimage
    gateway_config:
      subsystems_count: 3
      namespaces_count: 20
      cli_image: quay.io/ceph/nvmeof-cli:devel

- cephadm.wait_for_service:
    service: nvmeof.mypool.mygroup0
    refresh: True

# cross_namespace_copy_test.sh needs the SPDK cross namespace copy (CNC) feature,
# which is off by default. 'cnc_enable' is a boolean defaulting to false, so
# updating 'cnc_enable: true' is necessary to test the feature.
- exec:
    host.a:
      - ceph orch ls nvmeof --export > /tmp/nvmeof-orig.yaml
      - cp /tmp/nvmeof-orig.yaml /tmp/nvmeof-cnc.yaml
      - "sed -i -e '/^  cnc_enable:/d' -e '/^  cnc_rate_limiter_bytes:/a\\  cnc_enable: true' /tmp/nvmeof-cnc.yaml"
      - "grep -q '^  cnc_enable: true' /tmp/nvmeof-cnc.yaml"
      - cat /tmp/nvmeof-cnc.yaml
      - ceph orch ls
      - ceph orch apply -i /tmp/nvmeof-cnc.yaml
      - ceph orch redeploy nvmeof.mypool.mygroup0

- cephadm.wait_for_service:
    service: nvmeof.mypool.mygroup0
    refresh: True

- workunit:
    no_coverage_and_limits: true
    clients:
      client.0:
        - nvmeof/setup_subsystem.sh
        - nvmeof/basic_tests.sh
    env:
      RBD_POOL: mypool
      RBD_IMAGE_PREFIX: myimage
      NVMEOF_NATIVE_CLI: 'true'

- workunit:
    no_coverage_and_limits: true
    timeout: 30m
    clients:
      client.0:
        - nvmeof/fio_test.sh --rbd_iostat
      client.1:
        - nvmeof/basic_tests.sh
        - nvmeof/add_delete_test.sh
        - nvmeof/cross_namespace_copy_test.sh
    env:
      RBD_POOL: mypool
      IOSTAT_INTERVAL: '10'
      RUNTIME: '120'
      NEW_NAMESPACES_COUNT: '5'
