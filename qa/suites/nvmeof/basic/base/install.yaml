use_shaman: True
tasks:
- install:
    extra_packages:
        - nvme-cli
- cephadm:
- cephadm.shell:
    host.a:
    - ceph config set mgr mgr/cephadm/device_cache_timeout 86400
    # get state before nvmeof deployment
    - ceph orch status
    - ceph orch ps
    - ceph orch host ls
    - ceph orch device ls
    - ceph osd lspools
