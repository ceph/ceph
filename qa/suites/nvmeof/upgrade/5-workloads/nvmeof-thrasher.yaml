overrides:
  ceph:
    log-ignorelist:
      # nvmeof daemon thrashing, same set as qa/suites/nvmeof/thrash/thrashers/
      - CEPHADM_FAILED_DAEMON
      - failed cephadm daemon
      - CEPHADM_STRAY_DAEMON
      - stray daemon.* not managed by cephadm
      - CEPHADM_DAEMON_PLACE_FAIL
      - Failed to place .* daemon
      - CEPHADM_APPLY_SPEC_FAIL
      - Failed to apply .* service
      - Cannot place .* Unknown hosts
      - CEPHADM_REFRESH_FAILED
      - failed to probe daemons or devices

tasks:
- workunit:
    no_coverage_and_limits: true
    clients:
      client.0:
        - nvmeof/basic_tests.sh
    env:
      RBD_POOL: mypool
      RBD_IMAGE_PREFIX: myimage

- nvmeof.thrash:
    checker_host: 'client.0'

- workunit:
    no_coverage_and_limits: true
    timeout: 30m
    clients:
      client.0:
        - nvmeof/fio_test.sh --rbd_iostat
    env:
      RBD_POOL: mypool
      IOSTAT_INTERVAL: '10'
      RUNTIME: '600'
