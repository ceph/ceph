# Upgrading from tentacle must keep a user-provided grafana certificate.
# tentacle stores it in certmgr as grafana_cert/grafana_key; the upgrade
# migrates it to grafana_ssl_cert/grafana_ssl_key with certificate_source
# 'reference'. Only tentacle clusters set one up: the fingerprint saved in
# qa/grafana_user_cert_fp is what 5-grafana-user-cert-check.yaml verifies,
# and that check is skipped when the key is absent.
#
# NB: this directory is a teuthology product (it contains a '%' file), so
# every fragment is part of every job: sharing the '2-' numeric prefix with
# 2-repo_digest is fine and only fixes the ordering, it does not make the
# two fragments alternatives.
#
# NB: tentacle is detected through the mgr daemon metadata (ceph_release):
# 'ceph versions' reports bare version strings that do not contain the
# release codename. The private key is written as PKCS#8 because tentacle's
# 'certmgr cert-key set' only recognizes 'BEGIN PRIVATE KEY' PEM blocks.
tasks:
- cephadm.shell:
    mon.a:
      - |
        if ! ceph mgr metadata --format json | jq -r '.[].ceph_release' | grep -qx tentacle; then
            echo "not upgrading from tentacle, no grafana user certificate set up"
            exit 0
        fi
        host=$(ceph orch ps --daemon-type grafana --format json | jq -r '.[0].hostname')
        if [ -z "$host" ] || [ "$host" = "null" ]; then
            echo "no grafana daemon found, no grafana user certificate set up"
            exit 0
        fi
        addr=$(ceph orch host ls --format json | jq -r --arg h "$host" '.[] | select(.hostname == $h) | .addr')
        python3 - "$addr" "$host" <<'PY'
        import datetime, ipaddress, sys
        from cryptography import x509
        from cryptography.x509.oid import NameOID
        from cryptography.hazmat.primitives import hashes, serialization
        from cryptography.hazmat.primitives.asymmetric import rsa
        key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
        name = x509.Name([x509.NameAttribute(NameOID.ORGANIZATION_NAME, 'certmgr QA'),
                          x509.NameAttribute(NameOID.COMMON_NAME, sys.argv[2])])
        now = datetime.datetime.now(datetime.timezone.utc)
        cert = (x509.CertificateBuilder().subject_name(name).issuer_name(name)
                .public_key(key.public_key()).serial_number(x509.random_serial_number())
                .not_valid_before(now - datetime.timedelta(days=1))
                .not_valid_after(now + datetime.timedelta(days=365))
                .add_extension(x509.SubjectAlternativeName(
                    [x509.DNSName('grafana_servers'),
                     x509.DNSName(sys.argv[2]),
                     x509.IPAddress(ipaddress.ip_address(sys.argv[1]))]), critical=False)
                .sign(key, hashes.SHA256()))
        with open('/tmp/grafana.pem', 'w') as f:
            f.write(key.private_bytes(serialization.Encoding.PEM,
                                      serialization.PrivateFormat.PKCS8,
                                      serialization.NoEncryption()).decode())
            f.write(cert.public_bytes(serialization.Encoding.PEM).decode())
        with open('/tmp/grafana.fp', 'w') as f:
            f.write(cert.fingerprint(hashes.SHA256()).hex())
        PY
        ceph orch certmgr cert-key set grafana --hostname "$host" -i /tmp/grafana.pem
        ceph orch reconfig grafana
        fp=$(cat /tmp/grafana.fp)
        for i in $(seq 60); do
            served=$(python3 -c 'import hashlib, ssl, sys; print(hashlib.sha256(ssl.PEM_cert_to_DER_cert(ssl.get_server_certificate((sys.argv[1], 3000)))).hexdigest())' "$addr" || true)
            [ "$served" = "$fp" ] && break
            sleep 10
        done
        [ "$served" = "$fp" ]
        ceph config-key set qa/grafana_user_cert_fp "$fp"
