roles:
- - host.a
  - mon.a
  - mgr.x
  - osd.0
  - osd.1
  - client.0
- - host.b
  - mon.b
  - osd.2
  - osd.3
- - host.c
  - mon.c
  - osd.4
  - osd.5
# Reserve a host for acting as an smb client
- - host.d
  - cephadm.exclude
overrides:
  ceph:
    log-only-match:
      - CEPHADM_
tasks:
- openssl_keys:
    rcroot:
      client: client.0
      cn: rcroot
      key-type: rsa:4096
    remote-control:
      client: client.0
      ca: rcroot
      cn: remote-control
      add-san: true
    remote-control-client:
      client: client.0
      ca: rcroot
      cn: remote-control-client
      add-san: true
- smb.configure_samba_client_container:
    role: host.d
- pexec:
    all:
      - sudo setsebool -P virt_sandbox_use_netlink 1 || true
- cephadm:

- cephadm.shell:
    host.a:
      - ceph fs volume create cephfs
- cephadm.wait_for_service:
    service: mds.cephfs

- cephadm.shell:
    host.a:
      # add subvolgroup & subvolumes for test
      - cmd: ceph fs subvolumegroup create cephfs smb
      - cmd: ceph fs subvolume create cephfs sv1 --group-name=smb --mode=0777
      - cmd: ceph fs subvolume create cephfs sv2 --group-name=smb --mode=0777
      # set up smb cluster and shares
      - cmd: ceph mgr module enable smb
      # TODO: replace sleep with poll of mgr state?
      - cmd: sleep 30
      - cmd: ceph smb apply -i -
        stdin: |
          # --- Begin Embedded YAML
          - resource_type: ceph.smb.tls.credential
            tls_credential_id: rc-cert-1
            credential_type: cert
            value: |
              {{'cert@remote-control'|openssl_content|indent(4)}}
          - resource_type: ceph.smb.tls.credential
            tls_credential_id: rc-key-1
            credential_type: key
            value: |
              {{'key@remote-control'|openssl_content|indent(4)}}
          - resource_type: ceph.smb.tls.credential
            tls_credential_id: rc-ca-cert-1
            credential_type: cert
            value: |
              {{'cert@rcroot'|openssl_content|indent(4)}}
          - resource_type: ceph.smb.cluster
            cluster_id: ctdbrc1
            auth_mode: user
            user_group_settings:
              - {source_type: resource, ref: ug1}
            remote_control:
              cert: {ref: rc-cert-1}
              key: {ref: rc-key-1}
              ca_cert: {ref: rc-ca-cert-1}
            placement:
              count: 3
          - resource_type: ceph.smb.usersgroups
            users_groups_id: ug1
            values:
              users:
                - {name: user1, password: t3stP4ss1}
                - {name: user2, password: t3stP4ss2}
              groups: []
          - resource_type: ceph.smb.share
            cluster_id: ctdbrc1
            share_id: share1
            cephfs:
              volume: cephfs
              subvolumegroup: smb
              subvolume: sv1
              path: /
          - resource_type: ceph.smb.share
            cluster_id: ctdbrc1
            share_id: share2
            cephfs:
              volume: cephfs
              subvolumegroup: smb
              subvolume: sv2
              path: /
          # --- End Embedded YAML
# Wait for the smb service to start
- cephadm.wait_for_service:
    service: smb.ctdbrc1
# Since this is a true cluster there should be a clustermeta in rados
- cephadm.shell:
    host.a:
      - cmd: rados --pool=.smb -N ctdbrc1 get cluster.meta.json /dev/stdout

# Check if shares exist
- template.exec:
    host.d:
      - sleep 30
      - "{{ctx.samba_client_container_cmd|join(' ')}} smbclient -U user1%t3stP4ss1 //{{'host.a'|role_to_remote|attr('ip_address')}}/share1 -c ls"
      - "{{ctx.samba_client_container_cmd|join(' ')}} smbclient -U user2%t3stP4ss2 //{{'host.a'|role_to_remote|attr('ip_address')}}/share2 -c ls"

- smb.workunit:
    admin_node: host.a
    smb_nodes: [host.a, host.b, host.c]
    smb_shares:
      - share1
      - share2
    smb_users:
      - username: user1
        password: t3stP4ss1
      - username: user2
        password: t3stP4ss2
    timeout: 30m
    clients:
      client.0:
        - [ctdb_healthy, ceph_smb_ctl_ctdb]

- cephadm.shell:
    host.a:
      - cmd: ceph smb apply -i -
        stdin: |
          # --- Begin Embedded YAML
          - resource_type: ceph.smb.cluster
            cluster_id: ctdbrc1
            intent: removed
          - resource_type: ceph.smb.usersgroups
            users_groups_id: ug1
            intent: removed
          - resource_type: ceph.smb.share
            cluster_id: ctdbrc1
            share_id: share1
            intent: removed
          - resource_type: ceph.smb.share
            cluster_id: ctdbrc1
            share_id: share2
            intent: removed
          # --- End Embedded YAML
# Wait for the smb service to be removed
- cephadm.wait_for_service_not_present:
    service: smb.ctdbrc1
