# Shared cluster start for orch/cephadm/monitoring. Roles deploy prometheus,
# alertmanager, grafana, and node-exporter. Each 2-tests/*.yaml sets
# secure_monitoring_stack (conf_setup runs ahead of ceph_monitoring in
# qa/tasks/cephadm.py).
roles:
- - host.a
  - mon.a
  - mgr.a
  - osd.0
  - client.0
  - alertmanager.a
  - node-exporter.a
- - host.b
  - mon.b
  - mgr.b
  - osd.1
  - prometheus.a
  - grafana.a
  - node-exporter.b
- - host.c
  - mon.c
  - osd.2
  - node-exporter.c
overrides:
  ceph:
    log-only-match:
      - CEPHADM_
    # test_ceph_mon_down_alert stops a mon (MON_DOWN* and CEPHADM_STRAY /
    # FAILED while it is down). Other failures still fail via orch ls /
    # the Python asserts.
    log-ignorelist:
      - MON_DOWN
      - mons down
      - mon down
      - out of quorum
      - CEPHADM_STRAY_DAEMON
      - CEPHADM_FAILED_DAEMON
tasks:
- install:
- cephadm:
