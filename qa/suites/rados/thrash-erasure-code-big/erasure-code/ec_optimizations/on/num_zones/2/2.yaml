# Multi-zone configuration (stretched pools)
# Requires ec_optimizations: on
# Each zone of 6 OSDs holds k+m = 4 shards, so at most 2 OSDs may be out:
# with more out of one zone its PGs cannot get clean.
overrides:
  thrashosds:
    min_in: 10
  ceph:
    pool-config:
      num_zones: 2
      crush_map_config:
        failure_domain: osd
        zones:
          - name: zone1
            osds: [ 0, 1, 2, 3, 4, 5 ]
            monitors: [ a ]
          - name: zone2
            osds: [ 6, 7, 8, 9, 10, 11 ]
            monitors: [ b ]
        tiebreak_monitor: c


