# High operation count with many small objects
tasks:
  - rados:
      use-pool-config: true
      clients: [client.0]
      ops: 400000
      max_seconds: 600
      max_in_flight: 64
      objects: 1024
      size: 16384
      write_append_excl: false
      op_weights:
        read: 100
        write: 0
        append: 100
        delete: 50
        snap_create: 50
        snap_remove: 50
        rollback: 50
        copy_from: 50
        setattr: 25
        rmattr: 25
  - print: "**** done rados ec small-obj"