tasks:
- rados:
    clients: [client.0]
    ops: 4000
    objects: 50
    ec_pool: true
    write_append_excl: false
    balance_reads: true
    # SplitOp does not split reads that carry omap ops
    no_omap: true
    erasure_code_profile:
      name: isa21profile
      plugin: isa
      k: 2
      m: 1
      crush-failure-domain: osd
    migration_erasure_code_profile:
      name: isa42profile
      plugin: isa
      k: 4
      m: 2
      crush-failure-domain: osd
    op_weights:
      read: 100
      write: 0
      append: 100
      delete: 50
      snap_create: 50
      snap_remove: 50
      rollback: 50
      copy_from: 50
      setattr: 25
      rmattr: 25
