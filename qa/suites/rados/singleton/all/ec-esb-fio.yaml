meta:
  - desc:
      all/ec-esb-fio

roles:
- - mon.a
  - mgr.x
  - client.0
- - osd.0
  - osd.1
- - osd.2
  - osd.3
- - osd.4
  - osd.5
openstack:
  - volumes: # attached to each instance
      count: 6
      size: 20 # GB

overrides:
  ceph:
    conf:
      osd:
        bluestore write v2: false
        debug osd: 5
        debug bluestore: 5
        bluestore_elastic_shared_blobs: true
        osd memory target: 939524096
        bluestore onode segment size: 0
        bluestore debug extent map encode check: true

tasks:
- install:
- ceph:
    log-ignorelist:
      - \(POOL_APP_NOT_ENABLED\)
      - \(OSDMAP_FLAGS\)
      - \(OSD_
      - \(OBJECT_
      - \(PG_
      - \(SLOW_OPS\)
      - overall HEALTH
      - slow request
      # (BLOCK/DB/WAL)_DEVICE_DISCARD_QUEUE: this test creates a single pool,
      # writes heavily to it with fio and then deletes it in a controlled env.
      # The discard queue buildup is transient and harmless, warn is ignored.
      - \((BLOCK|DB|WAL)_DEVICE_DISCARD_QUEUE\)
- workunit:
    clients:
      client.0:
        - rados/ec-esb-fio.sh
