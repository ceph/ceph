    - \(POOL_APP_NOT_ENABLED\)
    - \(OSDMAP_FLAGS\)
    - \(OSD_
    - \(PG_
    - \(OBJECT_DEGRADED\)
    - Error -5 reading object
    - enough copies available
- workunit:
    clients:
      all:
        - rados/test_ec_sparse_read_repair_assert.sh