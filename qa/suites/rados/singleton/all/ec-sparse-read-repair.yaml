roles:
- - mon.a
  - mgr.x
  - osd.0
  - osd.1
  - osd.2
  - client.0
openstack:
  - volumes: # attached to each instance
      count: 2
      size: 10 # GB
tasks:
- install:
- ceph:
    pre-mgr-commands:
      - sudo ceph config set mgr mgr_pool false --force
    log-ignorelist:
    - but it is still running
    - had wrong client addr
    - had wrong cluster addr
    - reached quota
    - overall HEALTH_
