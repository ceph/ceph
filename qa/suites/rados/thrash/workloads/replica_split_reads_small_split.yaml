overrides:
  ceph:
    log-ignorelist:
      - \(POOL_APP_NOT_ENABLED\)
tasks:
  - rados:
      clients: [client.0]
      ops: 400000
      max_seconds: 600
      max_in_flight: 64
      objects: 1024
      balance_reads: true
      osd_min_split_replica_read_size: 65536
      no_omap: true
      op_weights:
        read: 100
        write: 100
        delete: 50
        copy_from: 50
        setattr: 25
        rmattr: 25
