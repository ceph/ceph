# N-2 and N-1 run ceph-dencoder from release images, so they don't depend
# on packages being built for the host distro. N uses the packages under test.
tasks:
- install:
    exclude_packages:
      - ceph-volume
      - ceph-osd-classic
    extra_system_packages:
      - podman

- print: "**** start dencoder N-2 (Tentacle) ****"
- workunit:
    clients:
      client.0:
        - dencoder/test-dencoder.sh
    env:
      DENCODER_IMAGE: quay.io/ceph/ceph:v20
- print: "**** done dencoder N-2 (Tentacle) ****"

- print: "**** start dencoder N-1 (Umbrella) ****"
- workunit:
    clients:
      client.0:
        - dencoder/test-dencoder.sh
    env:
      DENCODER_IMAGE: quay.io/ceph/ceph:v21
- print: "**** done dencoder N-1 (Umbrella) ****"

- print: "**** start dencoder N (under test) ****"
- workunit:
    clients:
      client.0:
        - dencoder/test-dencoder.sh
- print: "**** done dencoder N (under test) ****"
