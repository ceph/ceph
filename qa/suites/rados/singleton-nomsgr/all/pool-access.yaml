openstack:
  - volumes: # attached to each instance
      count: 2
      size: 10 # GB
roles:
- [mon.a, mgr.x, osd.0, osd.1, client.0]
tasks:
- install:
- ceph:
    pre-mgr-commands:
      - sudo ceph config set mgr mgr_pool false --force
    log-ignorelist:
    - \(POOL_APP_NOT_ENABLED\)
    - MDS_ALL_DOWN
    - MDS_UP_LESS_THAN_MAX
- workunit:
    clients:
      all:
        - rados/test_pool_access.sh
