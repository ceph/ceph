roles:
- [mon.a, mds.a, mgr.x, osd.0, osd.1, client.0]
overrides:
  ceph:
    log-ignorelist:
      - \(POOL_APP_NOT_ENABLED\)
      - MDS_ALL_DOWN
      - MDS_UP_LESS_THAN_MAX
tasks:
- install:
    extra_packages:
      deb:
        - libradosstriper-dev
        - librados-dev
        - libradospp-dev
      rpm:
        - libradosstriper-devel
        - librados-devel
        - libradospp-devel
- ceph:
    pre-mgr-commands:
      - sudo ceph config set mgr mgr_pool false --force
- workunit:
    clients:
      all:
        - rados/test_librados_build.sh
