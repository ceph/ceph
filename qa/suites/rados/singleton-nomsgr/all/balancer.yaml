roles:
- [mon.a, mgr.x, osd.0, osd.1, osd.2, client.0]
tasks:
- install:
- ceph:
    pre-mgr-commands:
      - sudo ceph config set mgr mgr_pool false --force
    fs: xfs
    log-ignorelist:
      - \(PG_AVAILABILITY\)
      - \(POOL_APP_NOT_ENABLED\)
      - MDS_ALL_DOWN
      - MDS_UP_LESS_THAN_MAX
- cram:
    clients:
      client.0:
      - src/test/cli-integration/balancer/misplaced.t
