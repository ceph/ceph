overrides:
  ceph:
    log-ignorelist:
      - Synthetic exception in serve
      - No InfluxDB server configured
      - Failed to list/create InfluxDB database \(MGR_INFLUX_DB_LIST_FAILED\)
      - foo bar
      - evicting unresponsive client
      - 1 mgr modules have recently crashed \(RECENT_MGR_MODULE_CRASH\)
tasks:
  - cephfs_test_runner:
      modules:
        - tasks.mgr.test_module_selftest
      fail_on_skip: false
