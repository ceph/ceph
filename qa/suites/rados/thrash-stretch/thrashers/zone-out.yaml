overrides:
  ceph:
    log-ignorelist:
      - but it is still running
      - objects unfound and apparently lost
      - slow request
      - \(POOL_APP_NOT_ENABLED\)
      - \(DEPRECATED_EC_PLUGIN\)
      - \(DEGRADED\)
      - \(PG_DEGRADED\)
      - \(PG_AVAILABILITY\)
      - \(DEGRADED_STRETCH_MODE\)
      - \(RECOVERING_STRETCH_MODE\)
      - \(MON_DOWN\)
      - \(OSD_DOWN\)
      - Degraded data redundancy
      - pgs degraded
      - pgs undersized
      - osds down
      - mon down
      - mons down
      - out of quorum
    conf:
      osd:
        osd scrub min interval: 60
        osd scrub max interval: 120
        osd max backfills: 6
tasks:
  - stretch_zone_thrash:
      # the zone is marked out, the other carries on alone, and the zone
      # comes back in and backfills
      mark_out: true
      hold_duration: 180
      degrade_timeout: 300
      revive_timeout: 1200
      thrash_delay: 30
