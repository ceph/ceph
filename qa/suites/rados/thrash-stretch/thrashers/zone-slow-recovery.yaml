overrides:
  ceph:
    log-ignorelist:
      - but it is still running
      - objects unfound and apparently lost
      - slow request
      - \(POOL_APP_NOT_ENABLED\)
      - \(DEPRECATED_EC_PLUGIN\)
      - \(DEGRADED\)
      - \(PG_DEGRADED\)
      - \(PG_AVAILABILITY\)
      - \(DEGRADED_STRETCH_MODE\)
      - \(RECOVERING_STRETCH_MODE\)
      - \(MON_DOWN\)
      - \(OSD_DOWN\)
      - Degraded data redundancy
      - pgs degraded
      - pgs undersized
      - osds down
      - mon down
      - mons down
      - out of quorum
    conf:
      osd:
        osd debug reject backfill probability: .3
        osd scrub min interval: 60
        osd scrub max interval: 120
        osd max backfills: 2
tasks:
  - stretch_zone_thrash:
      hold_duration: 120
      degrade_timeout: 300
      revive_timeout: 600
      thrash_delay: 60
