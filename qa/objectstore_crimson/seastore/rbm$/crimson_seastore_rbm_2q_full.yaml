teuthology:
  postmerge:
    - |
      -- With an HDD data tier, mkfs creates both a cache and a data device
      -- file, seastore_device_size (default 50G) each, in the OSD's data
      -- directory. On smithi that is a ~89GiB filesystem: the two do not
      -- fit, and mkfs fails with ENOSPC.
      if yaml.machine_type == "smithi" then
        yaml.overrides.ceph.conf.osd["seastore device size"] = "40G"
      end
overrides:
  ceph:
    conf:
      osd:
        # crimson's osd objectstore option
        osd objectstore: seastore
        seastore cachepin type: 2Q
        seastore cache device type: SSD
        seastore cache backend type: RANDOM_BLOCK
        seastore data device type: HDD
        seastore data backend type: RANDOM_BLOCK
        seastore_full_integrity_check: true
        debug seastore: 20
        debug seastore onode: 20
        debug seastore odata: 20
        debug seastore omap: 20
        debug seastore tm: 20
        debug seastore t: 20
        debug seastore cleaner: 20
        debug seastore epm: 20
        debug seastore lba: 20
        debug seastore fixedkv tree: 20
        debug seastore cache: 20
        debug seastore journal: 20
        debug seastore device: 20
        debug seastore backref: 20
