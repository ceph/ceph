# Dentry miss fetches only the requested key, plus a background fetch of the
# whole dirfrag once it has been hit mds_dir_prefetch_backend_hit_threshold
# times, throttled to one concurrent fetch per rank.
overrides:
  ceph:
    cluster-conf:
      mds:
        mds_dir_prefetch: false
        mds_dir_prefetch_backend: true
        mds_dir_prefetch_backend_max: 1
