overrides:
  workunit:
    # Register workunits with the DaemonWatchdog, so that a bark tears the
    # workunit down instead of leaving it to run against a cluster that has
    # already been declared dead. Without this, bark() only SIGTERMs the
    # daemons; the workunit keeps issuing ops that nothing will ever serve
    # until the job hits its own 3h limit, and the failure is then reported
    # against the workunit rather than against the daemon that failed.
    # See WorkunitProcess in qa/tasks/workunit.py.
    watchdog: true
  ceph:
    conf:
      osd:
        osd op queue: debug_random
        osd op queue cut off: debug_random
        osd debug verify missing on start: true
        osd debug verify cached snaps: true
        bluestore zero block detection: true
        osd mclock override recovery settings: true
        osd mclock profile: high_recovery_ops
        osd mclock skip benchmark: true
      mon:
        mon scrub interval: 300
        debug mon: 30
