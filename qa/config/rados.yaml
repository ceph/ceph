overrides:
  ceph:
    conf:
      osd:
        osd op queue: debug_random
        osd op queue cut off: debug_random
        osd debug verify missing on start: true
        osd debug verify cached snaps: true
        bluestore zero block detection: true
        osd mclock override recovery settings: true
        osd mclock profile: high_recovery_ops
        osd mclock skip benchmark: true
      mon:
        mon scrub interval: 300
        debug mon: 30
      client:
        # Bound client-side hangs. Without a deadline, a cluster that has
        # stopped serving I/O (all OSDs killed by the watchdog, a PG stuck
        # inactive, ...) leaves the workload blocked in librados until
        # teuthology's max_job_time kills the job hours later, with no
        # useful attribution. With a deadline the op fails -ETIMEDOUT, the
        # workload task exits non-zero, and the job fails where it broke.
        # 900s is the value already used by the fs suites
        # (qa/cephfs/conf/client.yaml); it is several times longer than the
        # longest stall any thrasher here induces on purpose (~125s for
        # test_pool_min_size, 80s for the injected pauses).
        rados osd op timeout: 900
