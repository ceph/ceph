name: Check PR Author Permissions

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

jobs:
  check-permissions:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check permissions, label, and comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const issueNumber = pr.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Handle the 'labeled' event separately and exit early: the
            // revocation logic below must not run when someone has just
            // granted approval, or it would strip the new 'ci-approved' label.
            if (context.payload.action === 'labeled') {
              if (context.payload.label.name !== 'ci-approved') {
                return;
              }
              // Labels only need triage permission, a lower bar than the
              // write access required of authors whose CI runs
              // automatically; hold approvers to the same bar.  Lookup
              // failures count as no permission, like the author check.
              const sender = context.payload.sender.login;
              let senderPermission = 'none';
              try {
                const response = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: sender,
                });
                senderPermission = response.data.permission;
              } catch (error) {
                console.log(`Failed to fetch permissions for ${sender}: ${error.message}`);
              }
              if (['admin', 'write'].includes(senderPermission)) {
                if (pr.labels.some(label => label.name === 'needs-ci-approval')) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: issueNumber,
                      name: 'needs-ci-approval',
                    });
                  } catch (error) {
                    console.log('Failed to remove needs-ci-approval label:', error);
                  }
                }
              } else {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: 'ci-approved',
                  });
                } catch (error) {
                  console.log('Failed to remove ci-approved label:', error);
                }
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: `@${sender} \`ci-approved\` can only be granted by someone with write access to ceph/ceph; the label has been removed.`,
                });
              }
              return;
            }

            let permission = 'none';
            try {
              const response = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: author,
              });
              permission = response.data.permission;
            } catch (error) {
              if (pr.user.type === 'Bot' && error.status === 404) {
                console.log(`Bot account ${author} not found as a direct collaborator, defaulting to 'none' permission.`);
              } else {
                console.log(`Failed to fetch permissions for ${author}: ${error.message}`);
              }
            }
            // On a public repo every user has at least 'read', so checking for
            // 'none' would never match a human author; require write or admin.
            const hasWrite = ['admin', 'write'].includes(permission);
            if (!hasWrite) {
              const currentLabels = pr.labels.map(label => label.name);

              // 1. Revoke approval on new pushes/updates by removing 'ci-approved'
              if (currentLabels.includes('ci-approved')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: 'ci-approved',
                  });
                } catch (error) {
                  console.log('Failed to remove ci-approved label:', error);
                }
              }

              // 2. Attach 'needs-ci-approval' label if not already present
              if (!currentLabels.includes('needs-ci-approval')) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ['needs-ci-approval'],
                });
              }

              // 3. Post notification comment on initial PR creation
              if (context.payload.action === 'opened') {
                const commentBody = `Thank you for your contribution. Since you are not yet a member of the [Ceph organization](https://github.com/ceph) with write permissions on ceph/ceph.git, our CI will not automatically run. Any member of the Ceph organization may label this PR \`ci-approved\` to allow Jenkins CI jobs to run.`;

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: commentBody,
                });
              }
            }
