name: Reviewer Submitted Review
run-name: "githubmap check for #${{ github.event.pull_request.number }}"
on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  review-submitted:
    name: Trigger .githubmap check
    if: github.event.review.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Hand over to reviewer-githubmap-comment.yml
        run: |
          echo "review by @${REVIEWER} on #${PR_NUMBER}"
        env:
          REVIEWER: ${{ github.event.review.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
